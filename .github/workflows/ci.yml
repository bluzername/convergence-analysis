name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell lint
        run: |
          bash -n install.sh
          shellcheck -S style install.sh

      - name: Skill frontmatter
        run: |
          f=skills/converge/SKILL.md
          head -1 "$f" | grep -qx -- '---' || { echo "missing frontmatter"; exit 1; }
          grep -q '^name: converge$' "$f" || { echo "missing name"; exit 1; }
          grep -q '^description: ' "$f" || { echo "missing description"; exit 1; }
          grep -q '\$ARGUMENTS' "$f" || { echo "missing \$ARGUMENTS placeholder"; exit 1; }
          echo "frontmatter ok"

      - name: Install into a temp directory
        run: |
          export CLAUDE_DIR="$RUNNER_TEMP/claude"
          bash install.sh --dry-run
          test ! -e "$CLAUDE_DIR/skills/converge/SKILL.md"
          bash install.sh
          cmp skills/converge/SKILL.md "$CLAUDE_DIR/skills/converge/SKILL.md"
          bash install.sh
          echo "install ok"

      - name: No em or en dashes
        run: |
          if grep -rnP '[\x{2013}\x{2014}]' --include='*.md' --include='*.sh' --include='*.yml' . ; then
            echo "dash characters found"; exit 1
          fi
